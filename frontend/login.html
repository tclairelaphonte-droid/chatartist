<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Backstage Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --surface:#121214; --surface-2:#1a1a1e;
  --border:rgba(212,175,55,.22);
  --gold:#d4af37; --gold-light:#f0d77b; --gold-dark:#a8861f;
  --ink:#f5f0e6; --muted:#9a958c;
  --font-display:'Cinzel',serif; --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:var(--font-body); display:flex; flex-direction:column; align-items:center;
  position:relative; overflow-x:hidden;
}
a{color:inherit; text-decoration:none;}

.bg-effects{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;}
.glow{position:absolute; border-radius:50%; filter:blur(80px); opacity:.3;}
.glow-1{width:400px; height:400px; top:-10%; left:10%; background:radial-gradient(circle,rgba(212,175,55,.4),transparent 70%);}
.glow-2{width:300px; height:300px; bottom:5%; right:5%; background:radial-gradient(circle,rgba(240,215,123,.25),transparent 70%);}

nav{
  position:relative; z-index:2; width:100%; padding:20px 40px;
  border-bottom:1px solid var(--border); background:rgba(10,10,11,.85); backdrop-filter:blur(12px);
}
.logo{font-family:var(--font-display); font-weight:600; font-size:18px; color:var(--gold);}
.logo span{color:var(--gold-light);}

.wrap{
  position:relative; z-index:2; width:100%; max-width:420px;
  margin:auto; padding:48px 24px 60px;
}
.eyebrow{
  font-size:11px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold); margin-bottom:12px;
}
h1{font-family:var(--font-display); font-size:28px; font-weight:600; margin:0 0 8px; color:var(--gold-light);}
.sub{color:var(--muted); font-size:14px; margin:0 0 28px; line-height:1.5;}

.mode-btn{
  width:100%; display:flex; align-items:center; justify-content:space-between;
  padding:16px 18px; margin-bottom:12px; border-radius:14px; cursor:pointer;
  border:1px solid var(--border); background:rgba(18,18,20,.9);
  color:var(--ink); font-weight:600; font-size:14px; transition:all .25s;
  font-family:var(--font-body);
}
.mode-btn:hover{border-color:var(--gold); background:rgba(212,175,55,.08);}
.mode-btn.active{border-color:var(--gold); box-shadow:0 0 0 1px var(--gold);}
.mode-btn .arrow{color:var(--gold); transition:transform .25s; font-size:12px;}
.mode-btn.active .arrow{transform:rotate(180deg);}

.panel{
  max-height:0; overflow:hidden; opacity:0;
  transition:max-height .35s ease, opacity .25s ease, margin .25s ease;
  margin-bottom:0;
}
.panel.open{max-height:420px; opacity:1; margin-bottom:16px;}

.panel-inner{
  border:1px solid var(--border); border-radius:14px; padding:18px;
  background:rgba(18,18,20,.95); margin-top:4px;
}
label{display:block; font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); margin-bottom:6px;}
input{
  width:100%; padding:12px 14px; border-radius:10px; margin-bottom:12px;
  border:1px solid var(--border); background:var(--surface); color:var(--ink);
  font-size:15px; font-family:inherit;
}
input:focus{outline:none; border-color:var(--gold); box-shadow:0 0 0 3px rgba(212,175,55,.12);}

.password-wrap{position:relative;}
.password-wrap input{padding-right:44px; margin-bottom:12px;}
.toggle-password{
  position:absolute; right:10px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--muted); cursor:pointer; padding:4px; font-size:14px;
}
.toggle-password:hover{color:var(--gold-light);}

.submit{
  width:100%; padding:13px; border:none; border-radius:12px; cursor:pointer;
  font-weight:700; font-size:14px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
  color:#0a0a0b; transition:filter .2s;
}
.submit:hover{filter:brightness(1.08);}
.submit:disabled{opacity:.6; cursor:not-allowed;}

.msg{display:none; margin-top:16px; padding:12px 14px; border-radius:10px; font-size:13.5px; line-height:1.4;}
.msg.show{display:block;}
.msg.info{background:rgba(212,175,55,.1); border:1px solid var(--border); color:var(--gold-light);}
.msg.error{background:rgba(225,29,60,.12); border:1px solid rgba(225,29,60,.35); color:#f0a0a8;}

.hint{text-align:center; margin-top:24px; font-size:13px; color:var(--muted);}
.hint a{color:var(--gold-light); font-weight:600;}
</style>
</head>
<body>

<div class="bg-effects">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
</div>

<nav>
  <a class="logo" href="index.html"><span>◆</span> Backstage Legends</a>
</nav>

<div class="wrap">
  <div class="eyebrow">Connexion</div>
  <h1>Bienvenue</h1>
  <p class="sub">Choisissez votre type de connexion pour continuer.</p>

  <!-- FAN -->
  <button type="button" class="mode-btn" id="btnFan">
    <span>Se connecter en tant que fan</span>
    <span class="arrow">▼</span>
  </button>
  <div class="panel" id="panelFan">
    <div class="panel-inner">
      <form id="formFan">
        <label for="fanEmail">Adresse e-mail</label>
        <input type="email" id="fanEmail" placeholder="vous@exemple.com" required autocomplete="email">
        <button type="submit" class="submit" id="submitFan">Continuer</button>
      </form>
    </div>
  </div>

  <!-- MANAGER -->
  <button type="button" class="mode-btn" id="btnManager">
    <span>Se connecter en tant que manager</span>
    <span class="arrow">▼</span>
  </button>
  <div class="panel" id="panelManager">
    <div class="panel-inner">
      <form id="formManager">
        <label for="mgrEmail">Adresse e-mail</label>
        <input type="email" id="mgrEmail" placeholder="manager@exemple.com" required autocomplete="email">
        <label for="mgrPassword">Mot de passe</label>
        <div class="password-wrap">
          <input type="password" id="mgrPassword" placeholder="••••••••" required minlength="8" autocomplete="current-password">
          <button type="button" class="toggle-password" id="togglePassword" aria-label="Afficher">👁</button>
        </div>
        <button type="submit" class="submit" id="submitManager">Se connecter</button>
      </form>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <p class="hint"><a href="index.html">← Retour à l’accueil</a></p>
</div>

<script src="api.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const btnFan = document.getElementById('btnFan');
  const btnManager = document.getElementById('btnManager');
  const panelFan = document.getElementById('panelFan');
  const panelManager = document.getElementById('panelManager');
  const msg = document.getElementById('msg');

  function showMsg(text, type) {
    msg.textContent = text;
    msg.className = 'msg show ' + (type || 'info');
  }

  function openPanel(which) {
    const isFan = which === 'fan';
    panelFan.classList.toggle('open', isFan);
    panelManager.classList.toggle('open', !isFan);
    btnFan.classList.toggle('active', isFan);
    btnManager.classList.toggle('active', !isFan);
    msg.classList.remove('show');
  }

  btnFan.addEventListener('click', function () {
    if (panelFan.classList.contains('open')) {
      panelFan.classList.remove('open');
      btnFan.classList.remove('active');
    } else openPanel('fan');
  });

  btnManager.addEventListener('click', function () {
    if (panelManager.classList.contains('open')) {
      panelManager.classList.remove('open');
      btnManager.classList.remove('active');
    } else openPanel('manager');
  });

  document.getElementById('togglePassword').addEventListener('click', function () {
    const input = document.getElementById('mgrPassword');
    input.type = input.type === 'password' ? 'text' : 'password';
  });

  function authCall(path, opts) {
    if (typeof apiAuth === 'function') return apiAuth(path, opts);
    if (typeof api === 'function') return api('/api/auth' + path, opts);
    return Promise.reject(new Error('api.js manquant'));
  }

  // --- FAN : email seul → enregistré / reconnecté en production ---
  document.getElementById('formFan').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('fanEmail').value.trim().toLowerCase();
    if (!email || email.indexOf('@') < 1) {
      showMsg('Indiquez une adresse e-mail valide.', 'error');
      return;
    }

    const btn = document.getElementById('submitFan');
    btn.disabled = true;
    btn.textContent = 'Connexion…';

    try {
      const data = await authCall('/fan-email', {
        method: 'POST',
        body: JSON.stringify({ email: email })
      });

      localStorage.setItem('backstage_token', data.access_token);

      const me = await authCall('/me');
      localStorage.setItem('backstage_username', me.username || email.split('@')[0]);
      localStorage.setItem('backstage_email', me.email || email);
      localStorage.setItem('backstage_role', me.role || 'fan');

      showMsg('Bienvenue ! Redirection…', 'info');
      const next = params.get('next');
      setTimeout(function () {
        window.location.href = next ? decodeURIComponent(next) : 'index.html';
      }, 400);
    } catch (err) {
      showMsg(err.message || 'Impossible de se connecter avec cet email.', 'error');
      btn.disabled = false;
      btn.textContent = 'Continuer';
    }
  });

  // --- MANAGER : email + mot de passe ---
  document.getElementById('formManager').addEventListener('submit', async function (e) {
    e.preventDefault();
    const email = document.getElementById('mgrEmail').value.trim().toLowerCase();
    const password = document.getElementById('mgrPassword').value;

    const btn = document.getElementById('submitManager');
    btn.disabled = true;
    btn.textContent = 'Connexion…';

    try {
      const data = await authCall('/login', {
        method: 'POST',
        body: JSON.stringify({ email: email, password: password })
      });

      localStorage.setItem('backstage_token', data.access_token);

      const me = await authCall('/me');

      if (me.role !== 'manager' && me.role !== 'admin') {
        localStorage.removeItem('backstage_token');
        throw new Error('Ce compte n’est pas un compte manager.');
      }

      localStorage.setItem('backstage_username', me.username);
      localStorage.setItem('backstage_email', me.email);
      localStorage.setItem('backstage_role', me.role);

      showMsg('Connexion réussie ! Redirection…', 'info');
      setTimeout(function () {
        window.location.href = me.role === 'admin' ? 'admin-dashboard.html' : 'manager-dashboard.html';
      }, 400);
    } catch (err) {
      showMsg(err.message || 'Email ou mot de passe incorrect.', 'error');
      btn.disabled = false;
      btn.textContent = 'Se connecter';
    }
  });
})();
</script>
</body>
</html>
