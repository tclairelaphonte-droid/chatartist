<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Backstage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff; --surface:#f6f6f8; --surface-2:#eeeef1; --border:#e7e7ec;
    --ink:#17171b; --muted:#6e6e79;
    --red:#e11d3c; --red-dark:#b91530; --red-soft:rgba(225,29,60,.08);
    --blue:#2457e8; --blue-soft:rgba(36,87,232,.08);
    --font-display:'Fraunces',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
    --shadow-sm:0 2px 10px rgba(23,23,27,.05);
  }
  *{box-sizing:border-box;}
  body{margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font-family:var(--font-body); display:flex; flex-direction:column; align-items:center;}
  a{color:inherit;}
  nav{width:100%; padding:22px 48px; border-bottom:1px solid var(--border); box-sizing:border-box;}
  .logo{font-family:var(--font-display); font-style:italic; font-weight:600; font-size:20px; text-decoration:none;}
  .logo span{color:var(--red); font-style:normal;}

  .wrap{max-width:400px; width:100%; margin:0 auto; padding:80px 24px; flex:1; display:flex; flex-direction:column; justify-content:center;}
  .eyebrow{font-family:var(--font-mono); font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); margin-bottom:12px;}
  h1{font-family:var(--font-display); font-size:30px; font-weight:600; margin:0 0 8px;}
  .sub{color:var(--muted); font-size:14.5px; margin:0 0 30px;}

  form{display:flex; flex-direction:column; gap:16px;}
  label{font-family:var(--font-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin-bottom:6px; display:block;}
  input{width:100%; padding:13px 14px; border-radius:10px; border:1px solid var(--border); background:#fff; color:var(--ink); font-family:var(--font-body); font-size:14.5px;}
  input:focus{outline:none; border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-soft);}

  .password-wrap{position:relative;}
  .password-wrap input{padding-right:44px;}
  .toggle-pw{
    position:absolute; right:6px; top:50%; transform:translateY(-50%); width:32px; height:32px;
    border:none; background:transparent; color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center;
    border-radius:8px; transition:all .15s ease;
  }
  .toggle-pw:hover{color:var(--blue); background:var(--blue-soft);}
  .toggle-pw svg{width:18px; height:18px;}

  .submit{margin-top:8px; padding:14px; border-radius:10px; border:1px solid var(--red); background:var(--red); color:#fff; font-weight:700; font-size:14.5px; cursor:pointer; transition:all .2s ease;}
  .submit:hover{background:var(--red-dark); border-color:var(--red-dark); box-shadow:0 8px 20px rgba(225,29,60,.25);}
  .submit:disabled{opacity:.6; cursor:not-allowed;}

  .msg{display:none; margin-top:18px; padding:12px 14px; border-radius:10px; font-size:13.5px;}
  .hint{text-align:center; font-size:13px; color:var(--muted); margin-top:22px;}
  .hint a{color:var(--blue); font-weight:600;}
</style>
</head>
<body>

<nav><a class="logo" href="index.html"><span>◆</span> Backstage</a></nav>

<div class="wrap">
  <div class="eyebrow">Réinitialisation</div>
  <h1>Choisissez un nouveau mot de passe</h1>
  <p class="sub" id="subtitle">Entrez votre nouveau mot de passe ci-dessous.</p>

  <form id="form">
    <div>
      <label>Nouveau mot de passe</label>
      <div class="password-wrap">
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="8">
        <button type="button" class="toggle-pw" id="togglePw1" title="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div>
      <label>Confirmer le mot de passe</label>
      <div class="password-wrap">
        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="8">
        <button type="button" class="toggle-pw" id="togglePw2" title="Afficher le mot de passe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="submit" id="submitBtn">Mettre à jour le mot de passe</button>
  </form>

  <div class="msg" id="msg"></div>

  <p class="hint"><a href="login.html">← Retour à la connexion</a></p>
</div>

<script>
  const API_BASE = "http://192.168.1.1:8000";
  const token = new URLSearchParams(location.search).get('token');
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('msg');

  if(!token){
    document.getElementById('subtitle').textContent = "Lien invalide : aucun jeton de réinitialisation trouvé dans l'URL.";
    form.style.display = 'none';
  }

  function showMessage(text, isError){
    msg.style.display = 'block';
    msg.textContent = text;
    msg.style.borderColor = isError ? 'var(--red)' : 'var(--blue)';
    msg.style.background = isError ? 'var(--red-soft)' : 'var(--blue-soft)';
    msg.style.color = isError ? 'var(--red)' : 'var(--blue)';
    msg.style.border = '1px solid ' + (isError ? 'var(--red)' : 'var(--blue)');
  }

  function setupToggle(btnId, inputId){
    const btn = document.getElementById(btnId);
    const input = document.getElementById(inputId);
    btn.addEventListener('click', ()=>{
      input.type = input.type === 'password' ? 'text' : 'password';
    });
  }
  setupToggle('togglePw1', 'newPassword');
  setupToggle('togglePw2', 'confirmPassword');

  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const newPassword = document.getElementById('newPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    if(newPassword !== confirmPassword){
      showMessage('Les deux mots de passe ne correspondent pas.', true);
      return;
    }
    if(newPassword.length < 8){
      showMessage('Le mot de passe doit contenir au moins 8 caractères.', true);
      return;
    }

    submitBtn.disabled = true;
    try{
      const res = await fetch(`${API_BASE}/auth/reset-password`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ token, new_password: newPassword })
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.detail || "Impossible de réinitialiser le mot de passe.");
      showMessage('Mot de passe mis à jour ! Redirection vers la connexion…', false);
      form.style.display = 'none';
      setTimeout(()=> location.href = 'login.html', 1500);
    } catch(err){
      showMessage(err.message || "Une erreur est survenue.", true);
    } finally {
      submitBtn.disabled = false;
    }
  });
</script>

</body>
</html>
