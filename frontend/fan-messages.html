<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Discussion — Backstage Legends</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0b; --surface:#121214; --surface-2:#1a1a1e;
  --border:rgba(212,175,55,.22);
  --gold:#d4af37; --gold-light:#f0d77b; --gold-dark:#a8861f;
  --ink:#f5f0e6; --muted:#9a958c;
  --font-display:'Cinzel',serif; --font-body:'Inter',sans-serif; --font-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;}
html,body{height:100%;}
html{height:100%;height:100dvh;overflow:hidden;-webkit-text-size-adjust:100%;}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);
  display:flex;flex-direction:column;min-height:100%;min-height:100dvh;height:100dvh;
  overflow:hidden;overscroll-behavior:none;position:relative;
}
a{color:inherit;text-decoration:none;}

.bg-effects{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
.glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.25;}
.glow-1{width:360px;height:360px;top:-10%;left:5%;background:radial-gradient(circle,rgba(212,175,55,.35),transparent 70%);}
.glow-2{width:280px;height:280px;bottom:5%;right:5%;background:radial-gradient(circle,rgba(240,215,123,.2),transparent 70%);}

nav{
  position:relative;z-index:5;display:flex;align-items:center;justify-content:space-between;
  padding:14px 24px;border-bottom:1px solid var(--border);flex-shrink:0;
  background:rgba(10,10,11,.9);backdrop-filter:blur(12px);
}
.logo{font-family:var(--font-display);font-weight:600;font-size:17px;color:var(--gold);}
.logo span{color:var(--gold-light);}
.back{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
.back:hover{color:var(--gold-light);}

.thread-header{
  position:relative;z-index:5;display:flex;align-items:center;gap:14px;
  padding:14px 24px;border-bottom:1px solid var(--border);flex-shrink:0;
  background:rgba(18,18,20,.95);
}
.thread-header .avatar{
  width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0;
  border:1px solid var(--border);background:var(--surface-2);
}
.thread-header .name{font-weight:600;font-size:15px;color:var(--ink);}
.thread-header .status{font-family:var(--font-mono);font-size:11px;color:var(--muted);}
.thread-header .status.online{color:var(--gold-light);}
.thread-header .status.online::before{content:'●';margin-right:5px;font-size:8px;color:var(--gold);}

.chat-area{
  position:relative;z-index:1;flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:24px;display:flex;flex-direction:column;gap:12px;max-width:760px;width:100%;margin:0 auto;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
}
.day-sep{text-align:center;font-family:var(--font-mono);font-size:11px;color:var(--muted);margin:10px 0 4px;}
.bubble-row{display:flex;position:relative;}
.bubble-row.mine{justify-content:flex-end;}
.bubble{
  max-width:64%;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.5;
  position:relative;white-space:pre-wrap;word-break:break-word;
}
.bubble-row:not(.mine) .bubble{
  background:rgba(18,18,20,.95);border:1px solid var(--border);border-bottom-left-radius:4px;
}
.bubble-row.mine .bubble{
  background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));
  color:#0a0a0b;border-bottom-right-radius:4px;
}
.bubble .time{display:inline-block;font-family:var(--font-mono);font-size:10px;margin-top:6px;opacity:.7;}
.sender-label{font-family:var(--font-mono);font-size:10px;color:var(--gold);margin-bottom:4px;}
.bubble.has-image{padding:6px;overflow:hidden;}
.bubble.has-image img{display:block;width:100%;max-width:280px;border-radius:11px;cursor:zoom-in;}
.bubble.sticker-msg{background:transparent!important;border:none!important;font-size:48px;padding:4px;line-height:1;color:var(--ink)!important;}
.bubble.sticker-msg .time{font-size:10px;color:var(--muted);display:block;margin-top:4px;}

.typing-row{display:none;align-items:center;gap:8px;font-family:var(--font-mono);font-size:11px;color:var(--muted);padding:4px 0;}
.typing-row.show{display:flex;}
.typing-dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin:0 1px;animation:tb 1.2s infinite ease-in-out;opacity:.5;}
.typing-dots span:nth-child(2){animation-delay:.15s;}
.typing-dots span:nth-child(3){animation-delay:.3s;}
@keyframes tb{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-3px);opacity:1}}

.composer{
  position:relative;z-index:10;border-top:1px solid var(--border);padding:14px 24px 18px;
  background:rgba(12,12,14,.96);flex-shrink:0;min-width:0;
}
.composer form{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center;}
.composer input[type="text"]{
  flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);font-family:var(--font-body);font-size:16px!important;
}
.composer input[type="text"]:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,175,55,.15);}
.icon-btn{
  width:44px;height:44px;flex-shrink:0;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--muted);display:flex;align-items:center;justify-content:center;
  cursor:pointer;font-size:18px;
}
.icon-btn:hover{border-color:var(--gold);color:var(--gold-light);}
.icon-btn:disabled{opacity:.5;cursor:not-allowed;}
.composer button[type="submit"]{
  padding:0 18px;border-radius:12px;border:none;height:44px;flex-shrink:0;cursor:pointer;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#0a0a0b;font-weight:700;font-size:13px;
}
.composer button[type="submit"]:disabled{opacity:.6;cursor:not-allowed;}
.composer .note{font-family:var(--font-mono);font-size:10px;color:var(--muted);text-align:center;margin-top:8px;}

.preview-strip{max-width:760px;margin:0 auto 10px;display:none;align-items:center;gap:10px;}
.preview-strip.show{display:flex;}
.preview-chip{position:relative;width:60px;height:60px;border-radius:10px;overflow:hidden;border:1px solid var(--border);}
.preview-chip img{width:100%;height:100%;object-fit:cover;}
.preview-chip .remove{position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
.preview-strip .preview-label{font-family:var(--font-mono);font-size:11px;color:var(--muted);}

.sticker-panel{
  display:none;position:absolute;bottom:100%;left:24px;right:24px;max-width:760px;margin:0 auto 8px;
  background:#121214;border:1px solid var(--border);border-radius:14px;padding:12px;max-height:180px;overflow-y:auto;
}
.sticker-panel.show{display:block;}
.sticker-grid{display:flex;flex-wrap:wrap;gap:6px;}
.sticker-grid button{width:40px;height:40px;border:none;background:var(--surface);border-radius:10px;font-size:22px;cursor:pointer;}
.sticker-grid button:hover{background:rgba(212,175,55,.15);}

.lightbox{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:100;align-items:center;justify-content:center;padding:40px;}
.lightbox.show{display:flex;}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:12px;}

/* Gate identité fan (sans page login) */
.gate{
  display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.7);
  align-items:center;justify-content:center;padding:20px;
}
.gate.show{display:flex;}
.gate-box{
  background:#121214;border:1px solid var(--border);border-radius:20px;padding:28px 24px;
  max-width:400px;width:100%;
}
.gate-box h2{font-family:var(--font-display);font-size:20px;color:var(--gold-light);margin:0 0 8px;}
.gate-box p{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px;}
.gate-box label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
.gate-box input{
  width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);
  background:var(--surface);color:var(--ink);margin-bottom:12px;font-size:15px;
}
.gate-box input:focus{outline:none;border-color:var(--gold);}
.gate-box .btn{
  width:100%;padding:13px;border:none;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;
  background:linear-gradient(135deg,var(--gold-light),var(--gold));color:#0a0a0b;margin-top:6px;
}
.gate-err{color:#e88;font-size:12px;margin-bottom:8px;display:none;}
.gate-err.show{display:block;}

@media (max-width:600px){
  nav{padding:10px 14px;min-height:52px;}
  .logo{font-size:15px;}
  .thread-header{padding:10px 14px;min-height:60px;}
  .thread-header .avatar{width:38px;height:38px;}
  .chat-area{max-width:none;padding:14px 12px;gap:10px;}
  .bubble{max-width:84%;padding:10px 13px;font-size:15px;}
  .composer{padding:8px 10px max(10px,env(safe-area-inset-bottom));}
  .composer form{max-width:none;gap:6px;}
  .icon-btn{width:42px;height:42px;min-width:42px;}
  .composer input[type="text"]{height:42px;padding:9px 11px;}
  .composer button[type="submit"]{height:42px;min-width:70px;padding:0 12px;font-size:13px;}
  .composer .note{display:none;}
  .sticker-panel{left:10px;right:10px;}
}
</style>
</head>
<body>

<div class="bg-effects">
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
</div>

<nav>
  <a href="index.html" class="logo"><span>◆</span> Backstage Legends</a>
  <a href="#" class="back" id="backLink">← Retour</a>
</nav>

<div class="thread-header">
  <img class="avatar" id="avatar" src="" alt="">
  <div>
    <div class="name" id="artistName">Discussion</div>
    <div class="status" id="statusEl">connexion…</div>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="day-sep">Aujourd'hui</div>
  <div class="typing-row" id="typingRow">
    <span class="typing-dots"><span></span><span></span><span></span></span>
    <span id="typingLabel">est en train d'écrire…</span>
  </div>
</div>

<div class="composer" id="composer">
  <div class="sticker-panel" id="stickerPanel">
    <div class="sticker-grid" id="stickerGrid"></div>
  </div>
  <div class="preview-strip" id="previewStrip">
    <div class="preview-chip">
      <img id="previewImg" src="" alt="">
      <div class="remove" id="removePreview">✕</div>
    </div>
    <span class="preview-label" id="previewLabel"></span>
  </div>
  <form id="form">
    <button type="button" class="icon-btn" id="stickerBtn" title="Stickers">😊</button>
    <label class="icon-btn" title="Photo">📎
      <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
    </label>
    <input type="text" id="input" placeholder="Écrivez votre message…" autocomplete="off">
    <button type="submit" id="submitBtn">Envoyer</button>
  </form>
  <div class="note">Votre message est automatiquement lié à cet artiste.</div>
</div>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<div class="gate" id="gate">
  <div class="gate-box">
    <h2>Pour discuter</h2>
    <p>Indiquez simplement votre prénom et votre email. Aucun mot de passe à retenir.</p>
    <div class="gate-err" id="gateErr"></div>
    <label for="gateName">Prénom / pseudo</label>
    <input type="text" id="gateName" maxlength="60" placeholder="Votre prénom">
    <label for="gateEmail">Email</label>
    <input type="email" id="gateEmail" placeholder="vous@email.com">
    <button type="button" class="btn" id="gateGo">Continuer la discussion</button>
  </div>
</div>

<script>
(function () {
  const API_BASE =
    location.hostname === "localhost" || location.hostname === "127.0.0.1"
      ? "http://127.0.0.1:8000"
      : "https://chatartist-backastage.vercel.app";

  let token = localStorage.getItem('backstage_token');
  let role = localStorage.getItem('backstage_role');

  const STICKERS = [
    '😀','😁','😄','😃','😊','😉','😍','🥰','😘','🤩','😎','🥳','🤗','🤔','😭','😂','🤣','😅','😮','😱',
    '❤️','🧡','💛','💚','💙','💜','🖤','🤍','🤎','💕','💖','💗','💓','💞','💘','❣️','💝',
    '👍','👎','👏','🙌','👌','🤝','🙏','💪','🤘','✌️','👊','🔥','⚡','✨','🎉','🚀','💯',
    '🎵','🎶','🎤','🎧','🎸','🌹','🎁','👑','☀️','🌙','🌈','🦄'
  ];

  const params = new URLSearchParams(location.search);
  const artistId = params.get('artist') || params.get('id');
  if (!artistId) {
    location.replace('index.html');
    return;
  }

  const chatArea = document.getElementById('chatArea');
  const typingRow = document.getElementById('typingRow');
  const statusEl = document.getElementById('statusEl');
  const input = document.getElementById('input');
  const form = document.getElementById('form');
  const submitBtn = document.getElementById('submitBtn');
  const fileInput = document.getElementById('fileInput');
  const previewStrip = document.getElementById('previewStrip');
  const previewImg = document.getElementById('previewImg');
  const previewLabel = document.getElementById('previewLabel');
  const stickerGrid = document.getElementById('stickerGrid');
  const stickerPanel = document.getElementById('stickerPanel');
  const lightbox = document.getElementById('lightbox');
  const lightboxImg = document.getElementById('lightboxImg');
  const gate = document.getElementById('gate');

  let conversationId = null;
  let lastCount = 0;
  let pendingFile = null;
  let sending = false;

  async function apiFetch(path, options) {
    options = options || {};
    const headers = Object.assign({}, options.headers || {});
    if (token) headers.Authorization = 'Bearer ' + token;
    const res = await fetch(API_BASE + path, Object.assign({}, options, { headers: headers }));
    let data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      const message = (data && data.detail) || ('Erreur ' + res.status);
      const err = new Error(typeof message === 'string' ? message : 'Erreur');
      err.status = res.status;
      throw err;
    }
    return data;
  }

  async function apiJson(path, method, body) {
    return apiFetch(path, {
      method: method,
      headers: { 'Content-Type': 'application/json' },
      body: body !== undefined ? JSON.stringify(body) : undefined,
    });
  }

  function resolveImageUrl(url) {
    if (!url) return '';
    if (url.startsWith('http') || url.startsWith('data:') || url.startsWith('blob:')) return url;
    if (url.startsWith('assets/') || url.startsWith('./assets/') || url.startsWith('/assets/')) return url;
    if (url.startsWith('/uploads/')) url = '/files/' + url.slice('/uploads/'.length);
    return API_BASE + (url.startsWith('/') ? url : '/' + url);
  }

  function formatTime(iso) {
    try {
      const d = new Date(iso);
      return d.getHours().toString().padStart(2, '0') + ':' + d.getMinutes().toString().padStart(2, '0');
    } catch (e) { return ''; }
  }

  function isStickerText(text) {
    if (!text) return false;
    const t = text.trim();
    return t.length <= 8 && STICKERS.indexOf(t) !== -1;
  }

  function playNotif() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.frequency.value = 880; o.type = 'sine';
      g.gain.setValueAtTime(0.1, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
      o.start(); o.stop(ctx.currentTime + 0.3);
    } catch (e) {}
  }

  function addMessageDOM(m) {
    const mine = m.sender_type === 'fan';
    const row = document.createElement('div');
    row.className = 'bubble-row' + (mine ? ' mine' : '');
    row.dataset.mid = m.id;
    const bubble = document.createElement('div');
    let cls = 'bubble';
    const imgUrl = m.image_url ? resolveImageUrl(m.image_url) : null;
    const sticker = !imgUrl && isStickerText(m.text);
    if (imgUrl) cls += ' has-image';
    if (sticker) cls += ' sticker-msg';
    bubble.className = cls;
    const label = mine ? '' : '<div class="sender-label">artist</div>';
    let body = '';
    if (imgUrl) {
      body = '<img src="' + imgUrl + '" alt="Photo">';
      if (m.text) {
        body += '<div style="padding:8px 8px 0;">' + m.text.replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>';
      }
    } else {
      body = (m.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    bubble.innerHTML = label + body + '<div><span class="time">' + formatTime(m.created_at) + '</span></div>';
    row.appendChild(bubble);
    chatArea.insertBefore(row, typingRow);
  }

  function renderMessages(messages) {
    if (messages.length > lastCount && lastCount > 0) {
      const newest = messages[messages.length - 1];
      if (newest && newest.sender_type === 'manager') playNotif();
    }
    lastCount = messages.length;
    chatArea.querySelectorAll('.bubble-row').forEach(function (r) { r.remove(); });
    messages.forEach(function (m) { addMessageDOM(m); });
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function showGate() {
    gate.classList.add('show');
  }

  function hideGate() {
    gate.classList.remove('show');
  }

  async function ensureFanSession() {
    if (token) {
      try {
        const me = await apiFetch('/api/auth/me');
        role = me.role;
        localStorage.setItem('backstage_role', role || '');
        if (role === 'manager' || role === 'admin') {
          location.replace('manager-dashboard.html');
          throw new Error('redirect');
        }
        return;
      } catch (e) {
        if (e.message === 'redirect') throw e;
        token = null;
        localStorage.removeItem('backstage_token');
      }
    }
    showGate();
    return new Promise(function (resolve, reject) {
      document.getElementById('gateGo').onclick = async function () {
        const username = (document.getElementById('gateName').value || '').trim();
        const email = (document.getElementById('gateEmail').value || '').trim();
        const errEl = document.getElementById('gateErr');
        errEl.classList.remove('show');
        if (username.length < 2 || !email || email.indexOf('@') < 1) {
          errEl.textContent = 'Prénom et email valides requis.';
          errEl.classList.add('show');
          return;
        }
        const password = 'Fan_' + Math.random().toString(36).slice(2) + Date.now().toString(36);
        try {
          let data;
          try {
            data = await apiJson('/api/auth/register', 'POST', {
              username: username,
              email: email,
              password: password
            });
          } catch (regErr) {
            data = await apiJson('/api/auth/login', 'POST', {
              email: email,
              password: password
            });
          }
          token = data.access_token;
          localStorage.setItem('backstage_token', token);
          localStorage.setItem('backstage_username', username);
          localStorage.setItem('backstage_email', email);
          localStorage.setItem('backstage_role', 'fan');
          try {
            const me = await apiFetch('/api/auth/me');
            localStorage.setItem('backstage_role', me.role || 'fan');
          } catch (e) {}
          hideGate();
          resolve();
        } catch (err) {
          // Email déjà utilisé avec un autre mot de passe
          errEl.textContent = err.message || 'Impossible de continuer. Essayez un autre email.';
          errEl.classList.add('show');
        }
      };
    });
  }

  async function loadArtist() {
    const artist = await apiFetch('/artists/' + artistId);
    document.getElementById('artistName').textContent = artist.name || 'Discussion';
    document.getElementById('avatar').src = resolveImageUrl(artist.avatar_url) || '';
    document.getElementById('backLink').href = 'artist.html?id=' + encodeURIComponent(artist.id);
    document.title = 'Discussion · ' + (artist.name || '') + ' — Backstage Legends';
  }

  async function startConversation() {
    const conv = await apiJson('/conversations/start/' + artistId, 'POST');
    conversationId = conv.id;
    if (conv.messages && conv.messages.length) renderMessages(conv.messages);
    statusEl.textContent = 'en ligne';
    statusEl.className = 'status online';
  }

  async function refreshMessages() {
    if (!conversationId) return;
    try {
      const messages = await apiFetch('/conversations/' + conversationId + '/messages');
      if (messages.length !== lastCount) renderMessages(messages);
    } catch (e) { console.warn(e); }
  }

  async function sendTextOnly(text) {
    if (!conversationId || sending) return;
    sending = true;
    try {
      await apiJson('/conversations/' + conversationId + '/messages', 'POST', { text: text });
      await refreshMessages();
    } catch (err) {
      alert(err.message || "Impossible d'envoyer le message");
    } finally {
      sending = false;
    }
  }

  async function uploadChatImage(file) {
    const formData = new FormData();
    formData.append('file', file);
    const data = await apiFetch('/conversations/' + conversationId + '/image', {
      method: 'POST',
      body: formData,
    });
    return data.image_url;
  }

  STICKERS.forEach(function (s) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s;
    b.onclick = function () {
      stickerPanel.classList.remove('show');
      sendTextOnly(s);
    };
    stickerGrid.appendChild(b);
  });

  document.getElementById('stickerBtn').onclick = function () {
    stickerPanel.classList.toggle('show');
  };

  fileInput.addEventListener('change', function () {
    const file = fileInput.files[0];
    if (!file) {
      pendingFile = null;
      previewStrip.classList.remove('show');
      return;
    }
    pendingFile = file;
    const reader = new FileReader();
    reader.onload = function () {
      previewImg.src = reader.result;
      previewLabel.textContent = file.name;
      previewStrip.classList.add('show');
    };
    reader.readAsDataURL(file);
  });

  document.getElementById('removePreview').onclick = function () {
    pendingFile = null;
    fileInput.value = '';
    previewStrip.classList.remove('show');
  };

  chatArea.addEventListener('click', function (e) {
    if (e.target.tagName === 'IMG' && e.target.closest('.bubble.has-image')) {
      lightboxImg.src = e.target.src;
      lightbox.classList.add('show');
    }
  });
  lightbox.onclick = function () { lightbox.classList.remove('show'); };

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    const text = input.value.trim();
    if (!text && !pendingFile) return;
    if (!conversationId || sending) return;

    sending = true;
    submitBtn.disabled = true;
    fileInput.disabled = true;

    try {
      let imageUrl = null;
      if (pendingFile) imageUrl = await uploadChatImage(pendingFile);
      await apiJson('/conversations/' + conversationId + '/messages', 'POST', {
        text: text || null,
        image_url: imageUrl,
      });
      await refreshMessages();
      input.value = '';
      pendingFile = null;
      fileInput.value = '';
      previewStrip.classList.remove('show');
    } catch (err) {
      console.error(err);
      alert(err.message || "Impossible d'envoyer le message.");
    } finally {
      sending = false;
      submitBtn.disabled = false;
      fileInput.disabled = false;
    }
  });

  (async function init() {
    try {
      await ensureFanSession();
      await loadArtist();
      await startConversation();
      setInterval(refreshMessages, 1500);
    } catch (err) {
      if (err && err.message === 'redirect') return;
      statusEl.textContent = 'erreur';
      statusEl.className = 'status';
      console.error(err);
    }
  })();
})();
</script>
</body>
</html>
